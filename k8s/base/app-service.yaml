apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  labels:
    app: oficina-api
spec:
  # LoadBalancer para cloud (EKS). No minikube: usar `minikube tunnel` OU
  # trocar para NodePort / usar `minikube service oficina-api` (ver k8s/README.md).
  type: LoadBalancer
  selector:
    app: oficina-api
  ports:
    - port: 80
      targetPort: 3000
