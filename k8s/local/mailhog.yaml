# APENAS para validação local no minikube (captura os e-mails de notificação da OS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  labels:
    app: mailhog
    tier: local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
        tier: local
    spec:
      containers:
        - name: mailhog
          image: mailhog/mailhog:v1.0.1
          ports:
            - containerPort: 1025   # SMTP
            - containerPort: 8025   # UI web
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  labels:
    app: mailhog
    tier: local
spec:
  type: ClusterIP
  selector:
    app: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: web
      port: 8025
      targetPort: 8025
