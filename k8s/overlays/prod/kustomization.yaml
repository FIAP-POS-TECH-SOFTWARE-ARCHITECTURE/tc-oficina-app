apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
patches:
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: NEW_RELIC_APP_NAME, value: oficina-api-prod }
    target: { kind: Deployment, name: oficina-api }
