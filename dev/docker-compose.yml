services:
  postgres:
    image: postgres:18-alpine
    container_name: oficina-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data_v18:/var/lib/postgresql

volumes:
  postgres_data_v18:
