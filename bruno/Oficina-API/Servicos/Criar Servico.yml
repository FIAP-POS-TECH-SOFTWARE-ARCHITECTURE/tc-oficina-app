info:
  name: Criar Servico
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/servicos"
  body:
    type: json
    data: |-
      {
          "nome": "Troca de Óleo",
          "descricao": "Troca de óleo do motor com filtro",
          "preco": 80.00,
          "tempoEstimadoMin": 30
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.id) {
          bru.setEnvVar("servicoId", res.body.data.id);
        }
