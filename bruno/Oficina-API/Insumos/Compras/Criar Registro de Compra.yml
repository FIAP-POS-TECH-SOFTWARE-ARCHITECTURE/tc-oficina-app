info:
  name: Criar Registro de Compra
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/insumos/compras"
  body:
    type: json
    data: |-
      {
          "insumoId": "{{insumoId}}",
          "quantidadeSolicitada": 10,
          "ordemServicoId": "{{osId}}"
        }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
