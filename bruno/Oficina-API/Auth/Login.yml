info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "adm@adm.com",
        "senha": "123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.accessToken) {
          bru.setEnvVar("token", res.body.data.accessToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
