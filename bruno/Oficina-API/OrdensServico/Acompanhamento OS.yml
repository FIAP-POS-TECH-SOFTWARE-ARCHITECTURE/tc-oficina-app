info:
  name: Acompanhamento OS
  type: http
  seq: 20

http:
  method: GET
  url: "{{url}}/os/acompanhamento/{{osNumero}}"
  auth: none

headers:
  - name: Authorization
    value: "Bearer {{clienteToken}}"
    enabled: true

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
