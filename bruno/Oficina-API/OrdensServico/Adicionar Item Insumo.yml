info:
  name: Adicionar Item Insumo
  type: http
  seq: 6

http:
  method: POST
  url: "{{url}}/os/{{osId}}/itens-insumo"
  body:
    type: json
    data: |-
      {
          "insumoId": "{{insumoId}}",
          "quantidade": 1
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && Array.isArray(res.body.data.itensInsumo)) {
          const itens = res.body.data.itensInsumo;
          const insumoId = bru.getEnvVar("insumoId");
          const item = itens.slice().reverse().find((i) => !insumoId || i.insumoId === insumoId) || itens[itens.length - 1];
          if (item && item.id) {
            bru.setEnvVar("itemInsumoId", item.id);
          }
        }
