info:
  name: Adicionar Item Insumo
  type: http
  seq: 5

http:
  method: POST
  url: "{{url}}/os/{{osId}}/itens-insumo"
  body:
    type: json
    data: |-
      {
          "insumoId": "{{insumoId}}",
          "quantidade": 1
        }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

