info:
  name: Adicionar Item Insumo
  type: http
  seq: 6

http:
  method: POST
  url: "{{url}}/os/{{osId}}/itens-insumo"
  body:
    type: json
    data: |-
      {
          "insumoId": "{{insumoId}}",
          "quantidade": 1
        }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.id) {
          bru.setEnvVar("itemInsumoId", res.body.data.id);
        }
