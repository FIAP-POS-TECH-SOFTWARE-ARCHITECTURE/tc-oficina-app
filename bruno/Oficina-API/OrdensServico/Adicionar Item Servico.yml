info:
  name: Adicionar Item Servico
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/os/{{osId}}/itens-servico"
  body:
    type: json
    data: |-
      {
          "servicoId": "{{servicoId}}",
          "quantidade": 1
        }
  auth: inherit

runtime:
  variables:
    - name: servicoId
      value: d7981701-80cd-49f5-8aca-0ce04a9405b7
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && Array.isArray(res.body.data.itensServico)) {
          const itens = res.body.data.itensServico;
          const servicoId = bru.getEnvVar("servicoId");
          const item = itens
            .filter((i) => !servicoId || i.servicoId === servicoId)
            .reduce((latest, current) => {
              if (!latest) return current;
              return new Date(current.createdAt) > new Date(latest.createdAt) ? current : latest;
            }, null) || itens[itens.length - 1];

          if (item && item.id) {
            bru.setEnvVar("itemServicoId", item.id);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
