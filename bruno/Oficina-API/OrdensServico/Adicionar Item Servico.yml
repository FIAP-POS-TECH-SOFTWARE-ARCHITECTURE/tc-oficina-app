info:
  name: Adicionar Item Servico
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/os/{{osId}}/itens-servico"
  body:
    type: json
    data: |-
      {
          "servicoId": "{{servicoId}}",
          "quantidade": 1
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.data && res.body.data.id) {
          bru.setEnvVar("itemServicoId", res.body.data.id);
        }
