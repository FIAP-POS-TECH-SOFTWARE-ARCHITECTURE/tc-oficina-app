info:
  name: Adicionar Item Servico
  type: http
  seq: 4

http:
  method: POST
  url: "{{url}}/os/{{osId}}/itens-servico"
  body:
    type: json
    data: |-
      {
          "servicoId": "{{servicoId}}",
          "quantidade": 1
        }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

