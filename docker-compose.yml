services:
  postgres:
    image: postgres:18-alpine
    container_name: oficina-postgres-deploy
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data_v18:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: oficina-api:local
    container_name: oficina-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - path: ./.env
        required: true
    environment:
      PORT: ${PORT:?Arquivo .env ausente ou PORT nao definido}
      JWT_SECRET: ${JWT_SECRET:?Arquivo .env ausente ou JWT_SECRET nao definido}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@oficina.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-ChangeMe!123}
      DATABASE_URL: ${DATABASE_URL:?Arquivo .env ausente ou DATABASE_URL nao definido}

volumes:
  postgres_data_v18:
